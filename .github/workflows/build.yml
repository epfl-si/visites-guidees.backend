name: Build

on:
  push:
    branches:
      - main
    paths:
     - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      packages: write
    name: Build ans push image

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check change version
        id: check_version
        run: |
          OLD_VERSION=$(git show HEAD~1:package.json | jq -r '.version')
          NEW_VERSION=$(jq -r '.version' package.json)

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build app image
        if: steps.check_version.outputs.changed == 'true'
        run: |
          docker build . --no-cache --tag backend

      - name: Scan image
        if: steps.check_version.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: 'backend'
          secerity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'sarif'
          limit-severities-for-sarif: true
          output: 'trivy.sarif'

      - name: Upload scan results to GitHub Security tab
        if: steps.check_version.outputs.changed == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy.sarif'

      - name: Log in to the Container registry
        if: steps.check_version.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: steps.check_version.outputs.changed == 'true'
        run: |
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}" | tr '[A-Z]' '[a-z]')
          VERSION=$(jq -r '.version' package.json)
          echo "Push image $IMAGE_ID:$VERSION"

          docker tag backend $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
