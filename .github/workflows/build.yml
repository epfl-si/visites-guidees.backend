name: Build

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    outputs:
      build_success:
        description: Build and push succeeded
        value: ${{ jobs.build.outputs.build_success }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      packages: write
    outputs:
      build_success: ${{ steps.result.outputs.success }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Build app image
        run: |
          docker build . --no-cache --tag backend

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'backend'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'sarif'
          limit-severities-for-sarif: true
          output: 'trivy.sarif'

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy.sarif'

      - name: Login to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}" | tr '[A-Z]' '[a-z]')
          TAG=${{ inputs.tag }}
          echo "Push image $IMAGE_ID:$TAG"

          docker tag backend $IMAGE_ID:$TAG
          docker push $IMAGE_ID:$TAG

      - name: Build success
        id: result
        run: echo "success=true" >> $GITHUB_OUTPUT
